services:
  - type: web
    name: studyflow-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: .venv/bin/alembic upgrade head
    healthCheckPath: /api/v1/ready
    envVars:
      - key: STUDYFLOW_ENVIRONMENT
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: 0.0.0.0/0
      - key: STUDYFLOW_DATABASE_URL
        sync: false
      - key: STUDYFLOW_PUBLIC_APP_URL
        value: https://studyflow.vercel.app
      - key: STUDYFLOW_CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: STUDYFLOW_SMTP_HOST
        value: smtp.resend.com
      - key: STUDYFLOW_SMTP_PORT
        value: "587"
      - key: STUDYFLOW_SMTP_USERNAME
        value: resend
      - key: STUDYFLOW_SMTP_PASSWORD
        sync: false
      - key: STUDYFLOW_SMTP_START_TLS
        value: "true"
      - key: STUDYFLOW_EMAIL_FROM_ADDRESS
        sync: false
      - key: STUDYFLOW_GOOGLE_OIDC_CLIENT_ID
        sync: false
      - key: STUDYFLOW_GOOGLE_OIDC_CLIENT_SECRET
        sync: false
      - key: STUDYFLOW_GOOGLE_OIDC_REDIRECT_URI
        value: https://studyflow-api.onrender.com/api/v1/auth/google/callback
