name: Storybook CI

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/storybook-ci.yml"]
  push:
    paths: ["frontend/**", ".github/workflows/storybook-ci.yml"]

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  stories:
    name: Story coverage, build, and Playwright interactions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:stories
      - run: pnpm build-storybook --disable-telemetry
      - run: pnpm test:storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: storybook-preview
          path: frontend/storybook-static
          retention-days: 7
