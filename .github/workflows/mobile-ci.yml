name: Mobile CI

on:
  pull_request:
    paths:
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    paths:
      - ".github/workflows/mobile-ci.yml"
      - "mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check mobile and shared packages
        run: pnpm --filter @studyflow/mobile typecheck

      - name: Lint mobile
        run: pnpm --filter @studyflow/mobile lint

      - name: Validate Expo configuration
        run: pnpm --filter @studyflow/mobile exec expo config --type public

      - name: Verify Metro runtime resolution
        run: pnpm --filter @studyflow/mobile exec node -e "require.resolve('react-native-css-interop/jsx-runtime')"
