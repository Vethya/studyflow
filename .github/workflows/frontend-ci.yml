name: Frontend CI

# SPEC §21: lint, type-check, and unit tests on every push; a production build
# and one minimal Playwright task-to-schedule smoke test on pull requests and
# master. The full NFR-05 browser matrix stays a nightly/pre-review run.

on:
  pull_request:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"
  push:
    paths:
      - ".github/workflows/frontend-ci.yml"
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test:coverage

  smoke:
    name: Build and task-to-schedule smoke test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.14.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build
        run: pnpm build

      # The runner already has Google Chrome for the "chrome" project; only
      # ffmpeg is missing, which Playwright needs to record failure videos.
      - name: Install Playwright ffmpeg
        run: pnpm exec playwright install ffmpeg

      # The smoke test mocks the API, so no backend is needed.
      - name: Playwright smoke test
        env:
          CI: "true"
        run: pnpm exec playwright test --project=chrome --grep "1440px viewport task-to-schedule workflow completes"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-smoke-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
